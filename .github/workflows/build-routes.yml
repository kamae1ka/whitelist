name: Build Domain List

on:
  push:
    branches:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Generate all-domains.txt
        run: |
          yq eval '.app.*.domains[]' resources.yaml | sed '/^$/d' | sort -u > all-domains.txt
          if [ ! -s all-domains.txt ]; then
            echo "Error: all-domains.txt is empty or missing"
            exit 1
          fi
          echo "Generated $(wc -l < all-domains.txt | xargs) domains"
          cat all-domains.txt

      - name: Commit and push changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add all-domains.txt
          if git diff --cached --quiet; then
            echo "No changes to all-domains.txt"
          else
            git commit -m "Update all domains $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
            echo "Successfully pushed changes to main"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
